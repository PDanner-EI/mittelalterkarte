<!DOCTYPE html>
<html lang="en">
<html>

<head>
    <title>Page Title</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="data.js"></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        .leaflet-container {
            height: 600px;
            width: 900px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>

<body>

    <div id="map"><button type="button">Click Me!</button></div>

    <script>

        var map = L.map('map').setView([48.20, 11.61], 8);

        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> | &copy; <a href="https://www.geoapify.com">Geoapify</a>'
        }).addTo(map);

        function onMapClick(e) {
            popup
                .setLatLng(e.latlng)
                .setContent(`You clicked the map at ${e.latlng.toString()}`)
                .openOn(map);
        }

        map.on('click', onMapClick);
        var currentMonth = 0;
        setMarkers();

        function setMarkers() {
            const locations = new Map();

            for (const event of data) {
                let months = getMonths(event.from, event.until)
                console.log(event)
                console.log(months)
                if (currentMonth != 0 && !months.includes(currentMonth)) {
                    continue;
                }

                const key = `${event.lat},${event.lon}`;

                if (!locations.has(key)) {
                    locations.set(key, []);
                }

                locations.get(key).push(event);

            }

            for (const group of locations.values()) {
                const { lat, lon } = group[0];

                L.marker([lat, lon]).addTo(map).bindPopup(makePopup(group));
            }
        }

        function getMonths(from, until) {
            var months = [];
            let fromStr = toString(from)
            let untilStr = toString(until)
            console.log(from)
            console.log(until)
            let start_month = parseInt(from.split(".")[1]);
            let start_year = parseInt(from.split(".")[2]);
            let stop_month = parseInt(until.split(".")[1]);
            let stop_year = parseInt(until.split(".")[2]);
            if (start_year < 2026) {
                start_month = 1;
            } else if (stop_year > 2026) {
                stop_month = 12;
            }
            while (start_month <= stop_month) {
                months.push(start_month);
                start_month++;
            }
            return months;
        }

        function makePopup(group) {
            console.log(group)
            var content = ""
            for (const event of group) {
                if (content != "") {
                    content = content + "<hr>"
                }
                content = content + '<a href="' + event.url + '">' + event.name + '</a>' + "<br>" + event.from + " bis " + event.until + "<br>" + event.plz + " " + event.place
            }
            return content;
        }

        function removeMarker() {
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
        }

        function showMonth(month) {
            removeMarker();
            currentMonth = month;
            setMarkers();
        }

        const MonthControl = L.Control.extend({
            options: {
                position: "topright"
            },

            onAdd: function () {
                const div = L.DomUtil.create("div", "leaflet-bar");

                div.innerHTML = `
            <button data-month="1">Jan</button><br>
            <button data-month="2">Feb</button><br>
            <button data-month="3">Mar</button><br>
            <button data-month="4">Apr</button><br>
            <button data-month="5">May</button><br>
            <button data-month="6">Jun</button><br>
            <button data-month="7">Jul</button><br>
            <button data-month="8">Aug</button><br>
            <button data-month="9">Sep</button><br>
            <button data-month="10">Oct</button><br>
            <button data-month="11">Nov</button><br>
            <button data-month="12">Dec</button>
        `;

                // Prevent map dragging when clicking the control
                L.DomEvent.disableClickPropagation(div);

                div.querySelectorAll("button").forEach(button => {
                    button.addEventListener("click", () => {
                        const month = Number(button.dataset.month);
                        showMonth(month);
                    });
                });

                return div;
            }
        });

        map.addControl(new MonthControl());


    </script>

</body>

</html>
